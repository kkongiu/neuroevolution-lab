name: FlyLoop R19 learned delegation
on:
  push:
    branches: [experiment/flyloop-r19-learned-delegation]
  pull_request:
    paths: ['neuroevolution/flyloop_r19.py','tests/test_flyloop_r19.py','.github/workflows/flyloop-r19.yml']
permissions:
  contents: read
jobs:
  delegation:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: R11–R19 regression
        run: |
          for i in 11 12 13 14 15 16 17 18 19; do
            python -m unittest discover -s tests -p "test_flyloop_r$i.py" -v
          done
      - name: Full frozen R19 campaign
        run: python -m neuroevolution.flyloop_r19
      - name: Deterministic repeat
        run: |
          python -m neuroevolution.flyloop_r19 --out results/flyloop_r19_repeat
          diff -r results/flyloop_r19 results/flyloop_r19_repeat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flyloop-r19-results
          path: results/flyloop_r19/
          retention-days: 30
          compression-level: 0
