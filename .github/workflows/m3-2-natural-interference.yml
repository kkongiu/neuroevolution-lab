name: M3.2 natural interference
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "campaigns/m3-2-kickoff-*.md"

permissions:
  contents: read

jobs:
  natural-continual-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests and leak checks
        run: python -m unittest discover -s tests -v
      - name: Frozen M3.2 meta-search and sealed final tests
        run: |
          python -m neuroevolution.m3_2 \
            --train-start 16000 --train-seeds 6 \
            --validation-start 17000 --validation-seeds 3 \
            --test-start 18000 --test-seeds 20 \
            --shifted-start 19000 --shifted-seeds 12 \
            --tasks 12 --steps 48 --batch-size 2 \
            --width 16 --eval-size 64 --report-every 12 \
            --learning-rate 0.04 --renew-units 3 \
            --quota 4 --generations 4 --population 8 \
            --search-seed 931 --forgetting-cost 0.08 \
            --out results/m3-2
      - name: Preserve full scientific output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-2-natural-interference
          path: results/m3-2/
          if-no-files-found: warn
          retention-days: 30
