name: M5.22 Dual Population Plasticity

on:
  push:
    branches:
      - experiment/m5-22-dual-population-memory-director
  pull_request:
    paths:
      - 'neuroevolution/m5_22_two_populations.py'
      - 'tests/test_m5_22_two_populations.py'
      - '.github/workflows/m5-22-two-populations.yml'

permissions:
  contents: read

jobs:
  duel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert real-reward gated experts, non-oracle memory triggers and frozen exams
        run: python -m unittest discover -s tests -p 'test_m5_22_two_populations.py' -v
      - name: Original M5.6 neural controller regressions
        run: python -m unittest discover -s tests -p 'test_m5_6_online.py' -v
      - name: Evaluate 24 independent seeds times seven two-population arms
        run: python -m neuroevolution.m5_22_two_populations
      - name: Archive raw exams, learned gates, memory/compute ledgers and paired differences
        uses: actions/upload-artifact@v4
        with:
          name: m5-22-dual-population-development
          path: results/m5-22/two-population-plasticity.json
          retention-days: 30
