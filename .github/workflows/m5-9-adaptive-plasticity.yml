name: M5.9d adaptive plasticity and multiple reversals

on:
  push:
    branches:
      - experiment/m5-9-adaptive-plasticity-reversals
  pull_request:
    paths:
      - 'neuroevolution/m5_9_adaptive_plasticity.py'
      - 'tests/test_m5_9_adaptive_plasticity.py'
      - 'neuroevolution/m5_6_online.py'
      - '.github/workflows/m5-9-adaptive-plasticity.yml'

permissions:
  contents: read

jobs:
  plasticity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rate-control, guard, repeated-reversal tests
        run: python -m unittest discover -s tests -p 'test_m5_9_adaptive_plasticity.py' -v
      - name: Previous individual learning gate regressions
        run: python -m unittest discover -s tests -p 'test_m5_9_individual_gate.py' -v
      - name: M5.6 original neural update regression
        run: python -m unittest discover -s tests -p 'test_m5_6_online.py' -v
      - name: Run 24 seeds times 4 adaptive controls
        run: python -m neuroevolution.m5_9_adaptive_plasticity
      - name: Archive complete individual trajectories
        uses: actions/upload-artifact@v4
        with:
          name: m5-9d-adaptive-plasticity-multi-reversal
          path: results/m5-9/adaptive-plasticity-reversal-development.json
          retention-days: 30
