name: M5.3C ancestral genotype transplant to unseen worlds
on:
  push:
    branches: ["experiment/m5-3c-genotype-transplant"]
    paths:
      - "campaigns/m5-3c-kickoff-*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genotype-transplant:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: All regression and frozen lineage-ancestry audits
        run: python -m unittest discover -s tests -v
      - name: Sealed 5-family by 24+12 world by 5-genotype neural transplant
        run: |
          python -m neuroevolution.m5_3c \
            --seed-start 84000 --seeds 24 \
            --shifted-start 85000 --shifted-seeds 12 \
            --ticks 400 --size 15 \
            --obstacle-density 0.12 --shifted-obstacle-density 0.20 \
            --initial-food 20 --food-cap 32 \
            --regeneration-attempts 2 \
            --regeneration-probability 0.55 \
            --shifted-regeneration-probability 0.40 \
            --odor-radius 5 --shifted-odor-radius 2 \
            --initial-population 20 --max-population 64 \
            --initial-energy 36 --max-energy 54 \
            --food-energy 18 --movement-cost 1 \
            --newborn-energy 12 --reproduction-energy-cost 20 \
            --min-reproduction-energy 34 --min-reproduction-age 4 \
            --max-age 100 --hidden 12 --checkpoint-every 50 \
            --initial-gene-sd 0.65 --gene-mutation-sd 0.16 \
            --sparse-gene-count 2 --no-food-controls 0 \
            --bootstrap-reps 20000 --out results/m5-3c
      - name: Archive original full-precision source genomes and all 900 world outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-3c-genotype-ancestor-transplant
          path: results/m5-3c/
          retention-days: 30
          if-no-files-found: warn
