name: M5.6 learned-synapse retention development test

on:
  push:
    branches:
      - experiment/m5-6-memory-predator-curiosity-protocol
    paths:
      - 'neuroevolution/m5_6_retention.py'
      - 'neuroevolution/m5_6_online.py'
      - 'tests/test_m5_6_retention.py'
      - '.github/workflows/m5-6-retention.yml'
  pull_request:
    paths:
      - 'neuroevolution/m5_6_retention.py'
      - 'neuroevolution/m5_6_online.py'
      - 'tests/test_m5_6_retention.py'
      - '.github/workflows/m5-6-retention.yml'

permissions:
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retention interventions and world-seal unit tests
        run: python -m unittest discover -s tests -p 'test_m5_6_retention.py' -v
      - name: Original online-learning regression tests
        run: python -m unittest discover -s tests -p 'test_m5_6_online.py' -v
      - name: Execute paired development retention experiment
        run: python -m neuroevolution.m5_6_retention
      - name: Archive all retained-versus-reset results
        uses: actions/upload-artifact@v4
        with:
          name: m5-6-development-learned-synapse-retention
          path: results/m5-6/development-synapse-retention.json
          retention-days: 30
