name: Plasticity confirmation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "campaigns/plasticity-confirmation-kickoff-*.md"

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate existing code before experiment
        run: python -m unittest discover -s tests -v
      - name: Run 24 new seeds over 16 successive tasks
        run: |
          python -m neuroevolution.plasticity \
            --seed-start 300 --seeds 24 \
            --tasks 16 --steps 128 --batch-size 2 \
            --width 24 --eval-size 96 --report-every 32 \
            --learning-rate 0.04 --reset-fraction 0.2 \
            --out results/plasticity-m1p2
      - name: Preserve evaluation data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasticity-m1p2-24-seeds
          path: results/plasticity-m1p2/
          if-no-files-found: warn
          retention-days: 30
