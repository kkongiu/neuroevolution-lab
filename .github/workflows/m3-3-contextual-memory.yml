name: M3.3 contextual memory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "campaigns/m3-3-kickoff-*.md"

permissions:
  contents: read

jobs:
  contextual-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all unit tests
        run: python -m unittest discover -s tests -v
      - name: Preregistered contextual memory and structural renewal
        run: |
          python -m neuroevolution.m3_3 \
            --train-start 20000 --train-seeds 4 \
            --validation-start 21000 --validation-seeds 2 \
            --test-start 22000 --test-seeds 24 \
            --shifted-start 23000 --shifted-seeds 12 \
            --contexts 4 --tasks 12 --steps 64 --batch-size 4 \
            --width 20 --eval-size 64 --report-every 16 \
            --learning-rate 0.04 --buffer-size 24 --replay-every 4 \
            --renew-units 3 --quota 3 \
            --generations 3 --population 6 --search-seed 971 \
            --memory-weight 0.20 --out results/m3-3
      - name: Archive contextual memory experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-3-contextual-memory
          path: results/m3-3/
          if-no-files-found: warn
          retention-days: 30
