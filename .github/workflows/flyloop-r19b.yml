name: FlyLoop R19B temporal learning
on:
  push:
    branches: [experiment/flyloop-r19b-temporal-learning]
    paths:
      - 'neuroevolution/flyloop_r19b.py'
      - 'tests/test_flyloop_r19b.py'
      - '.github/workflows/flyloop-r19b.yml'
  pull_request:
    branches: [experiment/flyloop-r18b-learned-vision]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  temporal:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        seed: [23100, 23101, 23102, 23103, 23104, 23105, 23106, 23107, 23108, 23109, 23110, 23111, 23112, 23113, 23114, 23115, 23116, 23117, 23118, 23119, 23120, 23121, 23122, 23123]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m neuroevolution.flyloop_r19b --seed ${{ matrix.seed }} --out results/first
      - run: python -m neuroevolution.flyloop_r19b --seed ${{ matrix.seed }} --out results/repeat
      - run: diff -rq results/first results/repeat
      - uses: actions/upload-artifact@v4
        with:
          name: r19b-seed-${{ matrix.seed }}
          path: results/first/
          retention-days: 3
  aggregate:
    needs: temporal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: r19b-seed-*
          path: results/shards
      - run: |
          set -o pipefail
          python -m neuroevolution.flyloop_r19b --combine results/shards | tee results-summary.txt
          cat results-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: r19b-summary
          path: results-summary.txt
