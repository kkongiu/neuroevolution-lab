name: FlyLoop R24A biomechanics
on:
  push:
    branches: [experiment/flyloop-r24a-biomechanics]
    paths:
      - 'neuroevolution/flyloop_r24a.py'
      - 'tests/test_flyloop_r24a.py'
      - '.github/workflows/flyloop-r24a.yml'
  pull_request:
    branches: [experiment/flyloop-r23a-single-renewable]
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m neuroevolution.flyloop_r24a --out results/first.json > results-summary.txt
      - run: python -m neuroevolution.flyloop_r24a --out results/repeat.json > repeat-summary.txt
      - run: diff results/first.json results/repeat.json
      - run: cat results-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r24a-bench
          path: |
            results/first.json
            results-summary.txt
