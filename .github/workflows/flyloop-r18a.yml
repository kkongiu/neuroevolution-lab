name: FlyLoop R18A compound eyes
on:
  push:
    branches: [experiment/flyloop-r18a-compound-eyes]
    paths:
      - 'neuroevolution/flyloop_r18a.py'
      - 'tests/test_flyloop_r18a.py'
      - '.github/workflows/flyloop-r18a.yml'
  pull_request:
    branches: [experiment/flyloop-r17-attractor-memory]
permissions:
  contents: read
jobs:
  eyes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m neuroevolution.flyloop_r18a --out results/r18a.json | tee results-summary.txt
      - run: python -m neuroevolution.flyloop_r18a --out results/r18a-repeat.json
      - run: cmp results/r18a.json results/r18a-repeat.json
      - run: cat results-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flyloop-r18a-compound-eyes
          path: |
            results/r18a*.json
            results-summary.txt
