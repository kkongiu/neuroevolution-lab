name: FlyLoop R9 Actual Fast Defensive Microstep Pathway

on:
  push:
    branches:
      - experiment/flyloop-r9-fast-defensive-pathway
  pull_request:
    paths:
      - 'neuroevolution/flyloop_r9.py'
      - 'tests/test_flyloop_r9.py'
      - '.github/workflows/flyloop-r9.yml'

permissions:
  contents: read

jobs:
  r9-fast-defense:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unmodified R1 original physical neurons regression
        run: python -m unittest discover -s tests -p 'test_flyloop_r1.py' -v
      - name: Unmodified R2 neural motor plasticity regression
        run: python -m unittest discover -s tests -p 'test_flyloop_r2.py' -v
      - name: Unmodified R3 sensory prediction regression
        run: python -m unittest discover -s tests -p 'test_flyloop_r3.py' -v
      - name: Unmodified R4 motor conditioned prediction regression
        run: python -m unittest discover -s tests -p 'test_flyloop_r4.py' -v
      - name: Unmodified R5 real physical action intervention regression
        run: python -m unittest discover -s tests -p 'test_flyloop_r5.py' -v
      - name: Unmodified R6 heldout intervention transfer regression
        run: python -m unittest discover -s tests -p 'test_flyloop_r6.py' -v
      - name: Unmodified R7 lifelong model-action feedback regression
        run: python -m unittest discover -s tests -p 'test_flyloop_r7.py' -v
      - name: Unmodified R8 actual injury and action learning regression
        run: python -m unittest discover -s tests -p 'test_flyloop_r8.py' -v
      - name: New R9 real .05s physics, fast causal bypass and old-feedback control
        run: python -m unittest discover -s tests -p 'test_flyloop_r9.py' -v
      - name: First preregistered 240-life physical microstep defense experiment
        run: python -m neuroevolution.flyloop_r9
      - name: Repeat all 240 lives and compare every serialized physical microstep bytewise
        run: |
          python -m neuroevolution.flyloop_r9 --out results/flyloop_r9/r9_repeat.json
          cmp results/flyloop_r9/r9_fast_defensive_microphysics.json results/flyloop_r9/r9_repeat.json
          sha256sum results/flyloop_r9/r9_fast_defensive_microphysics.json results/flyloop_r9/r9_repeat.json
      - name: Archive both full raw neural and microphysical datasets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyloop-r9-fast-defensive-microphysics-results
          path: |
            results/flyloop_r9/r9_fast_defensive_microphysics.json
            results/flyloop_r9/r9_repeat.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
