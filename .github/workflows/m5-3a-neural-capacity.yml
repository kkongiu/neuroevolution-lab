name: M5.3A fixed neural representational capacity
on:
  push:
    branches: ["experiment/m5-3a-neural-capacity"]
    paths:
      - "campaigns/m5-3a-kickoff-*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  representation:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: All regression and numerical neural identity tests
        run: python -m unittest discover -s tests -v
      - name: Frozen teacher-train, validation and sealed 24+12 neural test worlds
        run: |
          python -m neuroevolution.m5_3a \
            --seed-start 80000 --seeds 24 \
            --shifted-start 81000 --shifted-seeds 12 \
            --teacher-seed-start 79000 --teacher-seed-count 6 \
            --validation-teacher-start 79100 --validation-teacher-count 2 \
            --teacher-ticks 200 --train-cap 4500 --validation-cap 1500 \
            --epochs 12 --learning-rate 0.03 \
            --ticks 400 --size 15 \
            --obstacle-density 0.12 --shifted-obstacle-density 0.20 \
            --initial-food 20 --food-cap 32 \
            --regeneration-attempts 2 \
            --regeneration-probability 0.55 \
            --shifted-regeneration-probability 0.40 \
            --odor-radius 5 --shifted-odor-radius 2 \
            --initial-population 20 --max-population 64 \
            --initial-energy 36 --max-energy 54 \
            --food-energy 18 --movement-cost 1 \
            --newborn-energy 12 --reproduction-energy-cost 20 \
            --min-reproduction-energy 34 --min-reproduction-age 4 \
            --scripted-reproduction-threshold 46 \
            --max-age 100 --hidden 12 \
            --initial-weight-sd 0.45 --mutation-sd 0.12 \
            --negative-control-worlds 1 --no-food-controls 0 \
            --checkpoint-every 50 --out results/m5-3a
      - name: Archive fixed numerical genomes, world metrics, genealogies and SVG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-3a-numeric-neural-capacity
          path: results/m5-3a/
          if-no-files-found: warn
          retention-days: 30
