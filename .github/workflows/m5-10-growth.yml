name: M5.10 contextual neural growth and recall

on:
  push:
    branches:
      - experiment/m5-10-growing-neural-circuits
  pull_request:
    paths:
      - 'neuroevolution/m5_10_growth.py'
      - 'tests/test_m5_10_growth.py'
      - '.github/workflows/m5-10-growth.yml'

permissions:
  contents: read

jobs:
  growth-and-recall:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify structural growth and preallocation parity
        run: python -m unittest discover -s tests -p 'test_m5_10_growth.py' -v
      - name: Legacy neural update regression
        run: python -m unittest discover -s tests -p 'test_m5_6_online.py' -v
      - name: Measure 24 lineages times 3 modular-network architectures
        run: python -m neuroevolution.m5_10_growth
      - name: Archive every trajectory and growth event
        uses: actions/upload-artifact@v4
        with:
          name: m5-10-growing-modular-brain-contextual-recall
          path: results/m5-10/contextual-growth-development.json
          retention-days: 30
