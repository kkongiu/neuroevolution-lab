name: M2 adaptive renewal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "campaigns/m2-kickoff-*.md"

permissions:
  contents: read

jobs:
  m2:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tests
        run: python -m unittest discover -s tests -v
      - name: Evolve controller and run isolated sealed test
        run: |
          python -m neuroevolution.meta \
            --train-start 1000 --train-seeds 4 \
            --validation-start 2000 --validation-seeds 3 \
            --test-start 3000 --test-seeds 16 \
            --tasks 8 --steps 64 --batch-size 2 \
            --width 16 --eval-size 48 --report-every 16 \
            --learning-rate 0.04 --max-reset-fraction 0.20 \
            --generations 5 --population 8 \
            --reset-cost 0.025 --retention-cost 0.05 \
            --search-seed 911 --out results/m2
      - name: Preserve protocol output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-learned-renewal
          path: results/m2/
          if-no-files-found: warn
          retention-days: 30
