name: FlyLoop R23A single renewable
on:
  push:
    branches: [experiment/flyloop-r23a-single-renewable]
    paths:
      - 'neuroevolution/flyloop_r23a.py'
      - 'tests/test_flyloop_r23a.py'
      - '.github/workflows/flyloop-r23a.yml'
  pull_request:
    branches: [experiment/flyloop-r20d-lantern-foraging]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  foraging:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        seed: [35100, 35101, 35102, 35103, 35104, 35105, 35106, 35107, 35108, 35109, 35110, 35111]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m neuroevolution.flyloop_r23a --seed ${{ matrix.seed }} --out results/first
      - run: python -m neuroevolution.flyloop_r23a --seed ${{ matrix.seed }} --out results/repeat
      - run: diff -rq results/first results/repeat
      - uses: actions/upload-artifact@v4
        with:
          name: r23a-seed-${{ matrix.seed }}
          path: results/first/
          retention-days: 3
  aggregate:
    needs: foraging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: r23a-seed-*
          path: results/shards
      - run: |
          set -o pipefail
          python -m neuroevolution.flyloop_r23a --combine results/shards | tee results-summary.txt
          cat results-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: r23a-summary
          path: results-summary.txt
