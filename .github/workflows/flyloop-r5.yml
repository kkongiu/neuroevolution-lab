name: FlyLoop R5 Actual Physical Action Interventions

on:
  push:
    branches:
      - experiment/flyloop-r5-physical-action-interventions
  pull_request:
    paths:
      - 'neuroevolution/flyloop_r5.py'
      - 'tests/test_flyloop_r5.py'
      - '.github/workflows/flyloop-r5.yml'

permissions:
  contents: read

jobs:
  r5-interventions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original R1 physics and continuous recurrent motor regression
        run: python -m unittest discover -s tests -p 'test_flyloop_r1.py' -v
      - name: Original R2 motor plasticity regression
        run: python -m unittest discover -s tests -p 'test_flyloop_r2.py' -v
      - name: Original R3 next-sensor prediction regression
        run: python -m unittest discover -s tests -p 'test_flyloop_r3.py' -v
      - name: Original R4 action-conditioned predictor regression
        run: python -m unittest discover -s tests -p 'test_flyloop_r4.py' -v
      - name: R5 physical clone, six-step intervention, temporality and trained-frozen-head tests
        run: python -m unittest discover -s tests -p 'test_flyloop_r5.py' -v
      - name: First preregistered 48-lifetime 7200-real-physical-branch R5 science
        run: python -m neuroevolution.flyloop_r5
      - name: Full science repeat, bytewise compare all 48 lives and 7200 physical branches
        run: |
          python -m neuroevolution.flyloop_r5 --out results/flyloop_r5/r5_repeat.json
          cmp results/flyloop_r5/r5_physical_interventions.json results/flyloop_r5/r5_repeat.json
          sha256sum results/flyloop_r5/r5_physical_interventions.json results/flyloop_r5/r5_repeat.json
      - name: Archive original and complete replay sensory/intervention traces and frozen weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyloop-r5-physical-cloned-state-interventions
          path: |
            results/flyloop_r5/r5_physical_interventions.json
            results/flyloop_r5/r5_repeat.json
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
