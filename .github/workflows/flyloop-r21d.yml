name: FlyLoop R21D energy depletion
on:
  push:
    branches: [experiment/flyloop-r21d-energy-depletion]
    paths:
      - 'neuroevolution/flyloop_r21d.py'
      - 'tests/test_flyloop_r21d.py'
      - '.github/workflows/flyloop-r21d.yml'
  pull_request:
    branches: [experiment/flyloop-r21c-symmetric-predator]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  depletion:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        seed: [33100, 33101, 33102, 33103, 33104, 33105, 33106, 33107, 33108, 33109, 33110, 33111, 33112, 33113, 33114, 33115, 33116, 33117, 33118, 33119, 33120, 33121, 33122, 33123]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m neuroevolution.flyloop_r21d --seed ${{ matrix.seed }} --out results/first
      - run: python -m neuroevolution.flyloop_r21d --seed ${{ matrix.seed }} --out results/repeat
      - run: diff -rq results/first results/repeat
      - uses: actions/upload-artifact@v4
        with:
          name: r21d-seed-${{ matrix.seed }}
          path: results/first/
          retention-days: 3
  aggregate:
    needs: depletion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: r21d-seed-*
          path: results/shards
      - run: |
          set -o pipefail
          python -m neuroevolution.flyloop_r21d --combine results/shards | tee results-summary.txt
          cat results-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: r21d-summary
          path: results-summary.txt
