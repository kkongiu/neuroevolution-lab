name: M5.4C preregistered neural vs scripted motor/birth factorial
on:
  push:
    branches: ["experiment/m5-4c-movement-reproduction-factorial"]
    paths:
      - "campaigns/m5-4c-kickoff-*.md"

permissions:
  contents: read

jobs:
  four-arm-physiology-factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: All historical regressions plus hybrid action-selection and real-physics unit tests
        run: python -m unittest discover -s tests -v
      - name: Original sealed 144 matched 400-tick ecological world-policy comparisons
        run: |
          python -m neuroevolution.m5_4c \
            --seed-start 91000 --seeds 24 \
            --shifted-start 91100 --shifted-seeds 12 \
            --scripted-reproduction-threshold 46.0 \
            --ticks 400 --size 15 \
            --obstacle-density 0.12 \
            --shifted-obstacle-density 0.20 \
            --initial-food 20 --food-cap 32 \
            --regeneration-attempts 2 \
            --regeneration-probability 0.55 \
            --shifted-regeneration-probability 0.40 \
            --odor-radius 2 --shifted-odor-radius 2 \
            --initial-population 20 --max-population 64 \
            --initial-energy 36 --max-energy 54 \
            --food-energy 18 --movement-cost 1 \
            --newborn-energy 12 --reproduction-energy-cost 20 \
            --min-reproduction-energy 34 --min-reproduction-age 4 \
            --max-age 100 --hidden 12 --checkpoint-every 50 \
            --initial-gene-sd 0.65 --gene-mutation-sd 0.16 \
            --sparse-gene-count 2 --no-food-controls 0 \
            --bootstrap-reps 20000 \
            --out results/m5-4c
      - name: Archive full per-action ecological metrics and event traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-4c-neural-vs-programmed-motor-birth-factorial
          path: results/m5-4c/
          retention-days: 30
          if-no-files-found: warn
