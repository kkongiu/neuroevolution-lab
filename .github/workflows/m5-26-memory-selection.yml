name: M5.26 Memory Selection Under Budgets

on:
  push:
    branches:
      - experiment/m5-26-memory-selection-budget
  pull_request:
    paths:
      - 'neuroevolution/m5_26_memory_selection.py'
      - 'tests/test_m5_26_memory_selection.py'
      - '.github/workflows/m5-26-memory-selection.yml'

permissions:
  contents: read

jobs:
  constrained-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify safe novelty retention, FIFO/reservoir, 8-slot stress and no label leakage
        run: python -m unittest discover -s tests -p 'test_m5_26_memory_selection.py' -v
      - name: Original M5.6 regression tests
        run: python -m unittest discover -s tests -p 'test_m5_6_online.py' -v
      - name: Run 24 new seeds on 10 memory budgets/retention arms
        run: python -m neuroevolution.m5_26_memory_selection
      - name: Archive per-life frozen exams, memory utilization and confidence intervals
        uses: actions/upload-artifact@v4
        with:
          name: m5-26-memory-budget-development
          path: results/m5-26/compact-memory-development.json
          retention-days: 30
