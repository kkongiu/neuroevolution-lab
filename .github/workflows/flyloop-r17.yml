name: FlyLoop R17 motor curriculum
on:
  push:
    branches: [experiment/flyloop-r17-motor-curriculum]
  pull_request:
    paths: ['neuroevolution/flyloop_r17.py','tests/test_flyloop_r17.py','.github/workflows/flyloop-r17.yml']
permissions:
  contents: read
jobs:
  curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: R11–R17 regression
        run: |
          for i in 11 12 13 14 15 16 17; do
            python -m unittest discover -s tests -p "test_flyloop_r$i.py" -v
          done
      - name: Full frozen R17 campaign
        run: python -m neuroevolution.flyloop_r17
      - name: Deterministic repeat
        run: |
          python -m neuroevolution.flyloop_r17 --out results/flyloop_r17_repeat
          diff -r results/flyloop_r17 results/flyloop_r17_repeat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flyloop-r17-results
          path: results/flyloop_r17/
          retention-days: 30
          compression-level: 0
