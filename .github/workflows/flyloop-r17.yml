name: FlyLoop R17 attractor memory
on:
  push:
    branches: [experiment/flyloop-r17-attractor-memory]
    paths:
      - 'neuroevolution/flyloop_r17.py'
      - 'tests/test_flyloop_r17.py'
      - '.github/workflows/flyloop-r17.yml'
  pull_request:
    branches: [experiment/flyloop-r16b-obstacle-curriculum]
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m neuroevolution.flyloop_r17 --out results/r17.json | tee results-summary.txt
      - run: python -m neuroevolution.flyloop_r17 --out results/r17-repeat.json
      - run: cmp results/r17.json results/r17-repeat.json
      - run: cat results-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flyloop-r17-attractor-memory
          path: |
            results/r17*.json
            results-summary.txt
