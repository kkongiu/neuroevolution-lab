name: M4.4A frozen 6144 original unseen physical memory-reward trials and autonomous diagnostic
on:
  push:
    branches: ["experiment/m4-4a-online-plasticity-recurrent-embodied-memory"]
    paths:
      - "campaigns/m4-4a-heldout-kickoff-*.md"

permissions:
  contents: write

jobs:
  independent-test:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Original physics and causal online learning regression tests
        run: python -m unittest discover -s tests -v
      - name: Confirm exact independently pre-committed eight neural source family genomes and all updated recurrent synapses
        run: |
          test -s reports/M4_4A_FROZEN_ONLINE_SOURCE_BANK_2026-11-22.json
          test -s reports/M4_4A_all_6912_original_rewarded_source_episodes_2026-11-22.csv
          python - <<'PY'
          from pathlib import Path
          from neuroevolution import m4_4a as m
          z=m.load_bank(Path("reports/M4_4A_FROZEN_ONLINE_SOURCE_BANK_2026-11-22.json"))
          assert len(z["networks"])==8 and z["heldout_worlds_examined"]==0
          assert all(v["online_rnn_l2_drift_per_module"]["recurrent"]>0 for v in z["networks"])
          print("M4.4A FROZEN SOURCE GENETIC BANK SHA256",z["bank_sha256"])
          PY
      - name: Evaluate original frozen 6144 paired physical decision worlds and 256 independent autonomous transfers
        run: |
          python -m neuroevolution.m4_4a --phase final \
            --bank reports/M4_4A_FROZEN_ONLINE_SOURCE_BANK_2026-11-22.json \
            --out results/m4-4a
      - name: Preserve full ORIGINAL independent data before archiving
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-4a-original-6144-neural-plastic-recurrent-physical-test
          path: results/m4-4a/
          retention-days: 30
          if-no-files-found: warn
      - name: Permanently publish ALL original world-level outcomes and 20k eight-network cluster bootstrap
        if: success()
        run: |
          mkdir -p reports
          cp results/m4-4a/M4_4A_all_6144_original_guided_final_world_trials.csv \
            reports/M4_4A_all_6144_original_guided_final_world_trials_2026-11-22.csv
          cp results/m4-4a/M4_4A_all_256_original_autonomous_transfer_trials.csv \
            reports/M4_4A_all_256_original_autonomous_transfer_trials_2026-11-22.csv
          cp results/m4-4a/M4_4A_preregistered_results.json \
            reports/M4_4A_original_preregistered_8_network_bootstrap_results_2026-11-22.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/M4_4A_all_6144_original_guided_final_world_trials_2026-11-22.csv \
            reports/M4_4A_all_256_original_autonomous_transfer_trials_2026-11-22.csv \
            reports/M4_4A_original_preregistered_8_network_bootstrap_results_2026-11-22.json
          git commit -m "research(m4.4a): archive all 6144 original sealed causal memory worlds, autonomous transfer and cluster bootstrap"
          git push origin "HEAD:${GITHUB_REF_NAME}"
