name: M5.1 ecological viability diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "campaigns/m5-1-kickoff-*.md"

permissions:
  contents: read

jobs:
  viability:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regression suite and ecological physics controls
        run: python -m unittest discover -s tests -v
      - name: Preregistered 16 + 8 worlds ecological viability campaign
        run: |
          python -m neuroevolution.m5_1 \
            --seed-start 73000 --seeds 16 \
            --shifted-start 74000 --shifted-seeds 8 \
            --negative-control-worlds 4 \
            --ticks 400 --size 15 \
            --obstacle-density 0.12 --shifted-obstacle-density 0.20 \
            --initial-food 20 --food-cap 32 \
            --regeneration-attempts 2 \
            --regeneration-probability 0.55 \
            --shifted-regeneration-probability 0.40 \
            --odor-radius 5 --shifted-odor-radius 2 \
            --initial-population 20 --max-population 64 \
            --initial-energy 36 --max-energy 54 \
            --food-energy 18 --movement-cost 1 \
            --newborn-energy 12 --reproduction-energy-cost 20 \
            --min-reproduction-energy 34 --min-reproduction-age 4 \
            --scripted-reproduction-threshold 46 \
            --max-age 100 --hidden 12 \
            --initial-weight-sd 0.45 --mutation-sd 0.12 \
            --checkpoint-every 50 --no-food-controls 0 \
            --out results/m5-1
      - name: Archive energy ledger, per-world measures and historical traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-1-ecological-viability
          path: results/m5-1/
          if-no-files-found: warn
          retention-days: 30
