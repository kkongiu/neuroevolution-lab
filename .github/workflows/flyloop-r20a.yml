name: FlyLoop R20A multisensory integration
on:
  push:
    branches: [experiment/flyloop-r20a-multisensory]
    paths:
      - 'neuroevolution/flyloop_r20a.py'
      - 'tests/test_flyloop_r20a.py'
      - '.github/workflows/flyloop-r20a.yml'
  pull_request:
    branches: [experiment/flyloop-r19d-innate-integration]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  multisensory:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        seed: [26100, 26101, 26102, 26103, 26104, 26105, 26106, 26107, 26108, 26109, 26110, 26111, 26112, 26113, 26114, 26115, 26116, 26117, 26118, 26119, 26120, 26121, 26122, 26123]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m neuroevolution.flyloop_r20a --seed ${{ matrix.seed }} --out results/first
      - run: python -m neuroevolution.flyloop_r20a --seed ${{ matrix.seed }} --out results/repeat
      - run: diff -rq results/first results/repeat
      - uses: actions/upload-artifact@v4
        with:
          name: r20a-seed-${{ matrix.seed }}
          path: results/first/
          retention-days: 3
  aggregate:
    needs: multisensory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: r20a-seed-*
          path: results/shards
      - run: |
          set -o pipefail
          python -m neuroevolution.flyloop_r20a --combine results/shards | tee results-summary.txt
          cat results-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: r20a-summary
          path: results-summary.txt
