name: FlyLoop R15 attractors
on:
  push:
    branches: [experiment/flyloop-r15-attractors]
    paths:
      - 'neuroevolution/flyloop_r15.py'
      - 'tests/test_flyloop_r15.py'
      - '.github/workflows/flyloop-r15.yml'
  pull_request:
    branches: [experiment/flyloop-r14b-food-credit]
permissions:
  contents: read
jobs:
  attractors:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m neuroevolution.flyloop_r15 --out results/r15.json | tee results-summary.txt
      - run: python -m neuroevolution.flyloop_r15 --out results/r15-repeat.json
      - run: cmp results/r15.json results/r15-repeat.json
      - run: cat results-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flyloop-r15-attractors
          path: |
            results/r15*.json
            results-summary.txt
