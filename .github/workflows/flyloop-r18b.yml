name: FlyLoop R18B learned vision
on:
  push:
    branches: [experiment/flyloop-r18b-learned-vision]
    paths:
      - 'neuroevolution/flyloop_r18b*.py'
      - 'tests/test_flyloop_r18b*.py'
      - '.github/workflows/flyloop-r18b.yml'
  pull_request:
    branches: [experiment/flyloop-r18a-compound-eyes]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  vision:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        seed: [22100, 22101, 22102, 22103, 22104, 22105, 22106, 22107, 22108, 22109, 22110, 22111, 22112, 22113, 22114, 22115, 22116, 22117, 22118, 22119, 22120, 22121, 22122, 22123]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m neuroevolution.flyloop_r18b_shards --seed ${{ matrix.seed }} --out results/first
      - run: python -m neuroevolution.flyloop_r18b_shards --seed ${{ matrix.seed }} --out results/repeat
      - run: diff -rq results/first results/repeat
      - uses: actions/upload-artifact@v4
        with:
          name: r18b-seed-${{ matrix.seed }}
          path: results/first/
          retention-days: 3
  aggregate:
    needs: vision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: r18b-seed-*
          path: results/shards
      - run: |
          set -o pipefail
          python -m neuroevolution.flyloop_r18b_shards --combine results/shards | tee results-summary.txt
          cat results-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: r18b-summary
          path: results-summary.txt
