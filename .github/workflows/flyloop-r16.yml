name: FlyLoop R16 hierarchical veto
on:
  push:
    branches: [experiment/flyloop-r16-hierarchical-veto]
    paths:
      - 'neuroevolution/flyloop_r16.py'
      - 'tests/test_flyloop_r16.py'
      - '.github/workflows/flyloop-r16.yml'
  pull_request:
    branches: [experiment/flyloop-r15-attractors]
permissions:
  contents: read
jobs:
  hierarchy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m neuroevolution.flyloop_r16 --out results/r16.json | tee results-summary.txt
      - run: python -m neuroevolution.flyloop_r16 --out results/r16-repeat.json
      - run: cmp results/r16.json results/r16-repeat.json
      - run: cat results-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flyloop-r16-hierarchical-veto
          path: |
            results/r16*.json
            results-summary.txt
