name: M5.0 continuous ecology and in-world inheritance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "campaigns/m5-0-kickoff-*.md"

permissions:
  contents: read

jobs:
  continuous-ecology:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Historical regression, energy physics, birth mechanism and null-control tests
        run: python -m unittest discover -s tests -v
      - name: Preregistered persistent ecological selection experiment
        run: |
          python -m neuroevolution.m5_0 \
            --seed-start 71000 --seeds 12 \
            --shifted-start 72000 --shifted-seeds 8 \
            --ticks 400 --size 15 \
            --obstacle-density 0.12 --shifted-obstacle-density 0.20 \
            --initial-food 20 --food-cap 32 \
            --regeneration-attempts 2 \
            --regeneration-probability 0.55 \
            --shifted-regeneration-probability 0.40 \
            --odor-radius 5 --shifted-odor-radius 2 \
            --initial-population 20 --max-population 64 \
            --initial-energy 36 --max-energy 54 \
            --food-energy 18 --movement-cost 1 \
            --newborn-energy 12 --reproduction-energy-cost 20 \
            --min-reproduction-energy 34 --min-reproduction-age 4 \
            --max-age 100 --hidden 12 \
            --initial-weight-sd 0.45 --mutation-sd 0.12 \
            --checkpoint-every 50 --no-food-controls 4 \
            --out results/m5-0
      - name: Retain complete ecological ledger, lineage data and visuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-0-continuous-ecology
          path: results/m5-0/
          if-no-files-found: warn
          retention-days: 30
