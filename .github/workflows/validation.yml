name: Validation
on:
  push:
    branches: [main, "experiment/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke experiment
        run: python -m neuroevolution --generations 2 --population 6 --episodes 2 --steps 40 --hidden 4 --flip-interval 10 --out results/smoke
      - name: Plasticity smoke experiment
        run: python -m neuroevolution.plasticity --seed-start 5 --seeds 2 --tasks 3 --steps 12 --batch-size 2 --width 6 --eval-size 24 --report-every 4 --out results/plasticity-smoke
      - name: M2 meta-controller smoke experiment
        run: python -m neuroevolution.meta --train-start 14 --train-seeds 2 --validation-start 100 --validation-seeds 1 --test-start 200 --test-seeds 2 --tasks 3 --steps 12 --batch-size 2 --width 6 --eval-size 16 --report-every 4 --generations 2 --population 4 --out results/m2-smoke
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: smoke-metrics
          path: |
            results/smoke/
            results/plasticity-smoke/
            results/m2-smoke/
          retention-days: 30
