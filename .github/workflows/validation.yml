name: Validation
on:
  push:
    branches: [main, "experiment/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke experiment
        run: python -m neuroevolution --generations 2 --population 6 --episodes 2 --steps 40 --hidden 4 --flip-interval 10 --out results/smoke
      - name: Plasticity smoke experiment
        run: python -m neuroevolution.plasticity --seed-start 5 --seeds 2 --tasks 3 --steps 12 --batch-size 2 --width 6 --eval-size 24 --report-every 4 --out results/plasticity-smoke
      - name: M2 meta-controller smoke experiment
        run: python -m neuroevolution.meta --train-start 14 --train-seeds 2 --validation-start 100 --validation-seeds 1 --test-start 200 --test-seeds 2 --tasks 3 --steps 12 --batch-size 2 --width 6 --eval-size 16 --report-every 4 --generations 2 --population 4 --out results/m2-smoke
      - name: M2B budgeted timing smoke experiment
        run: python -m neuroevolution.meta_budget --train-start 40 --train-seeds 2 --validation-start 90 --validation-seeds 1 --test-start 140 --test-seeds 2 --tasks 3 --steps 12 --batch-size 2 --width 6 --eval-size 16 --report-every 4 --generations 2 --population 4 --out results/m2b-smoke
      - name: M3 unpredictable recurrence CLI smoke
        run: python -m neuroevolution.m3 --train-start 21 --train-seeds 2 --validation-start 100 --validation-seeds 1 --test-start 200 --test-seeds 2 --shifted-start 300 --shifted-seeds 2 --tasks 8 --steps 12 --batch-size 2 --width 6 --eval-size 16 --report-every 4 --generations 2 --population 4 --out results/m3-smoke
      - name: M3.1 causal counterfactual smoke
        run: python -m neuroevolution.m3_1 --train-start 20 --train-seeds 2 --validation-start 100 --validation-seeds 1 --test-start 200 --test-seeds 2 --shifted-start 300 --shifted-seeds 2 --trials 2 --width 6 --reset-units 2 --pretrain-steps 12 --adaptation-steps 12 --batch-size 2 --probe-size 16 --eval-size 20 --report-every 4 --out results/m3-1-smoke
      - name: M3.2 natural-interference smoke
        run: python -m neuroevolution.m3_2 --train-start 20 --train-seeds 2 --validation-start 100 --validation-seeds 1 --test-start 200 --test-seeds 2 --shifted-start 300 --shifted-seeds 2 --tasks 6 --steps 12 --batch-size 2 --width 6 --eval-size 16 --report-every 4 --renew-units 1 --quota 2 --generations 2 --population 4 --out results/m3-2-smoke
      - name: M3.3 contextual-memory smoke
        run: python -m neuroevolution.m3_3 --train-start 20 --train-seeds 2 --validation-start 100 --validation-seeds 1 --test-start 200 --test-seeds 2 --shifted-start 300 --shifted-seeds 2 --tasks 6 --steps 8 --batch-size 2 --width 6 --eval-size 12 --report-every 2 --buffer-size 4 --replay-every 2 --renew-units 1 --quota 2 --generations 2 --population 4 --out results/m3-3-smoke
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: smoke-metrics
          path: |
            results/smoke/
            results/plasticity-smoke/
            results/m2-smoke/
            results/m2b-smoke/
            results/m3-smoke/
            results/m3-1-smoke/
            results/m3-2-smoke/
            results/m3-3-smoke/
          retention-days: 30
