name: Validation
on:
  push:
    branches: [main, "experiment/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install neural M5.28 test dependency
        run: python -m pip install 'numpy==2.3.5'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke experiment
        run: python -m neuroevolution --generations 2 --population 6 --episodes 2 --steps 40 --hidden 4 --flip-interval 10 --out results/smoke
      - name: Plasticity smoke experiment
        run: python -m neuroevolution.plasticity --seed-start 5 --seeds 2 --tasks 3 --steps 12 --batch-size 2 --width 6 --eval-size 24 --report-every 4 --out results/plasticity-smoke
      - name: M2 meta-controller smoke experiment
        run: python -m neuroevolution.meta --train-start 14 --train-seeds 2 --validation-start 100 --validation-seeds 1 --test-start 200 --test-seeds 2 --tasks 3 --steps 12 --batch-size 2 --width 6 --eval-size 16 --report-every 4 --generations 2 --population 4 --out results/m2-smoke
      - name: M2B budgeted timing smoke experiment
        run: python -m neuroevolution.meta_budget --train-start 40 --train-seeds 2 --validation-start 90 --validation-seeds 1 --test-start 140 --test-seeds 2 --tasks 3 --steps 12 --batch-size 2 --width 6 --eval-size 16 --report-every 4 --generations 2 --population 4 --out results/m2b-smoke
      - name: M3 unpredictable recurrence CLI smoke
        run: python -m neuroevolution.m3 --train-start 21 --train-seeds 2 --validation-start 100 --validation-seeds 1 --test-start 200 --test-seeds 2 --shifted-start 300 --shifted-seeds 2 --tasks 8 --steps 12 --batch-size 2 --width 6 --eval-size 16 --report-every 4 --generations 2 --population 4 --out results/m3-smoke
      - name: M3.1 causal counterfactual smoke
        run: python -m neuroevolution.m3_1 --train-start 20 --train-seeds 2 --validation-start 100 --validation-seeds 1 --test-start 200 --test-seeds 2 --shifted-start 300 --shifted-seeds 2 --trials 2 --width 6 --reset-units 2 --pretrain-steps 12 --adaptation-steps 12 --batch-size 2 --probe-size 16 --eval-size 20 --report-every 4 --out results/m3-1-smoke
      - name: M3.2 natural-interference smoke
        run: python -m neuroevolution.m3_2 --train-start 20 --train-seeds 2 --validation-start 100 --validation-seeds 1 --test-start 200 --test-seeds 2 --shifted-start 300 --shifted-seeds 2 --tasks 6 --steps 12 --batch-size 2 --width 6 --eval-size 16 --report-every 4 --renew-units 1 --quota 2 --generations 2 --population 4 --out results/m3-2-smoke
      - name: M3.3 contextual-memory smoke
        run: python -m neuroevolution.m3_3 --train-start 20 --train-seeds 2 --validation-start 100 --validation-seeds 1 --test-start 200 --test-seeds 2 --shifted-start 300 --shifted-seeds 2 --tasks 6 --steps 8 --batch-size 2 --width 6 --eval-size 12 --report-every 2 --buffer-size 4 --replay-every 2 --renew-units 1 --quota 2 --generations 2 --population 4 --out results/m3-3-smoke
      - name: M3.4 latent-context inference smoke
        run: python -m neuroevolution.m3_4 --train-start 30 --train-seeds 2 --validation-start 100 --validation-seeds 1 --test-start 200 --test-seeds 2 --few-start 300 --few-seeds 2 --shifted-start 400 --shifted-seeds 2 --tasks 8 --steps 8 --batch-size 2 --width 6 --eval-size 12 --report-every 2 --main-support 8 --hard-support 4 --hard-flips 1 --prototype-size 12 --buffer-size 4 --replay-every 2 --knn-k 3 --out results/m3-4-smoke
      - name: M3.5 active-information smoke
        run: python -m neuroevolution.m3_5 --train-start 20 --train-seeds 2 --validation-start 100 --validation-seeds 1 --test-start 200 --test-seeds 2 --shifted-start 300 --shifted-seeds 2 --few-start 400 --few-seeds 2 --tasks 8 --steps 8 --batch-size 2 --width 6 --eval-size 12 --report-every 2 --main-support 6 --hard-support 6 --hard-flips 1 --prototype-size 12 --buffer-size 4 --knn-k 3 --replay-every 2 --extra-per-request 2 --request-quota 2 --out results/m3-5-smoke
      - name: M4.0 evolving survival world smoke
        run: python -m neuroevolution.m4_0 --train-start 10 --train-worlds 2 --validation-start 100 --validation-worlds 1 --test-start 200 --test-worlds 3 --shifted-start 300 --shifted-worlds 2 --size 11 --food-count 6 --shifted-food-count 4 --odor-radius 4 --shifted-odor-radius 2 --horizon 35 --hidden 5 --population 6 --generations 2 --elites 2 --immigrants 1 --out results/m4-0-smoke
      - name: M4.1 masked-navigation replicated smoke
        run: python -m neuroevolution.m4_1 --train-start 10 --train-worlds 2 --validation-start 100 --validation-worlds 1 --test-start 200 --test-worlds 3 --shifted-start 300 --shifted-worlds 2 --genetic-seed-start 800 --genetic-runs 2 --size 11 --hidden 5 --horizon 35 --food-count 6 --shifted-food-count 4 --odor-radius 4 --shifted-odor-radius 2 --population 6 --generations 2 --elites 2 --immigrants 1 --out results/m4-1-smoke
      - name: M4.2 delayed-cue memory smoke
        run: python -m neuroevolution.m4_2 --train-start 10 --train-worlds 2 --validation-start 100 --validation-worlds 1 --test-start 200 --test-worlds 3 --shifted-start 300 --shifted-worlds 2 --reactive-start 400 --reactive-worlds 2 --genetic-seed-start 800 --genetic-runs 2 --size 13 --hidden 4 --ff-hidden 5 --stem-min 3 --stem-max 4 --shifted-stem-min 4 --shifted-stem-max 5 --cue-ticks 2 --horizon 14 --population 6 --generations 2 --elites 2 --immigrants 1 --out results/m4-2-smoke
      - name: M4.3 causal recall smoke
        run: python -m neuroevolution.m4_3 --train-start 10 --train-worlds 2 --validation-start 100 --validation-worlds 2 --test-start 200 --test-worlds 3 --shifted-start 300 --shifted-worlds 2 --guided-start 500 --guided-worlds 2 --genetic-seed-start 810 --genetic-runs 2 --reactive-start 400 --reactive-worlds 2 --size 13 --hidden 4 --ff-hidden 5 --population 6 --generations 2 --stem-min 3 --stem-max 4 --shifted-stem-min 4 --shifted-stem-max 5 --cue-ticks 2 --horizon 14 --elites 2 --immigrants 1 --out results/m4-3-smoke
      - name: M5.0 persistent ecology smoke
        run: python -m neuroevolution.m5_0 --seed-start 700 --seeds 2 --shifted-start 900 --shifted-seeds 2 --ticks 40 --size 11 --initial-food 9 --food-cap 14 --initial-population 8 --max-population 18 --checkpoint-every 10 --no-food-controls 2 --hidden 4 --out results/m5-0-smoke
      - name: M5.1 ecological viability smoke
        run: python -m neuroevolution.m5_1 --seed-start 700 --seeds 2 --shifted-start 900 --shifted-seeds 2 --negative-control-worlds 2 --ticks 40 --size 11 --initial-food 9 --food-cap 14 --initial-population 8 --max-population 18 --checkpoint-every 10 --no-food-controls 0 --hidden 4 --out results/m5-1-smoke
      - name: M5.2A factorial smoke
        run: python -m neuroevolution.m5_2a --seed-start 700 --seeds 2 --shifted-start 900 --shifted-seeds 2 --negative-control-worlds 1 --ticks 40 --size 11 --initial-food 9 --food-cap 14 --initial-population 8 --max-population 18 --checkpoint-every 10 --no-food-controls 0 --hidden 4 --out results/m5-2a-smoke
      - name: M5.2B fully neural genetics smoke
        run: python -m neuroevolution.m5_2b --seed-start 700 --seeds 2 --shifted-start 900 --shifted-seeds 2 --ticks 40 --size 11 --initial-food 9 --food-cap 14 --initial-population 8 --max-population 18 --checkpoint-every 10 --no-food-controls 0 --hidden 2 --sparse-mutated-weights 3 --out results/m5-2b-smoke
      - name: M5.3A numerical neural representation smoke
        run: python -m neuroevolution.m5_3a --seed-start 700 --seeds 2 --shifted-start 900 --shifted-seeds 2 --teacher-seed-start 1100 --teacher-seed-count 2 --validation-teacher-start 1200 --validation-teacher-count 1 --teacher-ticks 35 --train-cap 150 --validation-cap 90 --epochs 3 --ticks 40 --size 11 --initial-food 9 --food-cap 14 --initial-population 8 --max-population 18 --checkpoint-every 10 --negative-control-worlds 1 --no-food-controls 0 --hidden 12 --out results/m5-3a-smoke
      - name: M5.3B genuine genetic evolution smoke
        run: python -m neuroevolution.m5_3b --seed-start 700 --seeds 2 --shifted-start 900 --shifted-seeds 2 --ticks 40 --size 11 --initial-food 9 --food-cap 14 --initial-population 8 --max-population 18 --checkpoint-every 10 --no-food-controls 0 --hidden 12 --sparse-gene-count 2 --initial-gene-sd 0.65 --gene-mutation-sd 0.16 --out results/m5-3b-smoke
      - name: M5.3C original-genealogy and transplant smoke
        run: python -m neuroevolution.m5_3c --seed-start 700 --seeds 2 --shifted-start 900 --shifted-seeds 2 --ticks 40 --size 11 --initial-food 9 --food-cap 14 --initial-population 8 --max-population 18 --checkpoint-every 10 --bootstrap-reps 200 --no-food-controls 0 --hidden 12 --out results/m5-3c-smoke
      - name: M5.4A eight-cell paired ecological controls smoke
        run: python -m neuroevolution.m5_4a --seed-start 700 --seeds 2 --shifted-start 900 --shifted-seeds 2 --ticks 40 --size 11 --initial-food 9 --food-cap 14 --initial-population 8 --max-population 18 --checkpoint-every 10 --negative-control-worlds 1 --no-food-controls 0 --hidden 12 --bootstrap-main 120 --bootstrap-validation 100 --out results/m5-4a-smoke
      - name: M5.4B0 short odor native numerical genotype smoke
        run: python -m neuroevolution.m5_4b0 --development-start 200 --development-seeds 2 --validation-start 300 --validation-seeds 2 --seed-start 700 --seeds 2 --shifted-start 900 --shifted-seeds 2 --initial-pool 6 --generations 1 --offspring-per-generation 4 --keep-elites 2 --ticks 35 --size 11 --initial-food 9 --food-cap 14 --initial-population 8 --max-population 18 --checkpoint-every 10 --no-food-controls 0 --bootstrap-reps 140 --out results/m5-4b0-smoke
      - name: M5.4B0-R bounded 18-gene recurrent architecture smoke
        run: python -m neuroevolution.m5_4b0r --development-start 400 --development-seeds 2 --validation-start 500 --validation-seeds 2 --seed-start 600 --seeds 2 --shifted-start 700 --shifted-seeds 2 --external-pool 6 --external-generations 1 --external-offspring 4 --external-elites 2 --ticks 35 --size 11 --initial-food 9 --food-cap 14 --initial-population 8 --max-population 18 --checkpoint-every 10 --no-food-controls 0 --bootstrap-reps 110 --out results/m5-4b0r-smoke
      - name: M5.4C diagnostic neural/scripted 2-by-2 original-physics smoke
        run: python -m neuroevolution.m5_4c --seed-start 300 --seeds 2 --shifted-start 400 --shifted-seeds 2 --ticks 35 --size 11 --initial-food 9 --food-cap 14 --initial-population 8 --max-population 18 --checkpoint-every 10 --no-food-controls 0 --bootstrap-reps 120 --out results/m5-4c-smoke
      - name: M5.5A naive-born innate-genetic organism heredity smoke
        run: python -m neuroevolution.m5_5a --seed-start 300 --seeds 2 --shifted-start 400 --shifted-seeds 2 --ticks 30 --size 11 --initial-food 9 --food-cap 14 --initial-population 8 --max-population 18 --checkpoint-every 10 --no-food-controls 0 --bootstrap-reps 100 --out results/m5-5a-smoke
      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: smoke-metrics
          path: |
            results/smoke/
            results/plasticity-smoke/
            results/m2-smoke/
            results/m2b-smoke/
            results/m3-smoke/
            results/m3-1-smoke/
            results/m3-2-smoke/
            results/m3-3-smoke/
            results/m3-4-smoke/
            results/m3-5-smoke/
            results/m4-0-smoke/
            results/m4-1-smoke/
            results/m4-2-smoke/
            results/m4-3-smoke/
            results/m5-0-smoke/
            results/m5-1-smoke/
            results/m5-2a-smoke/
            results/m5-2b-smoke/
            results/m5-3a-smoke/
            results/m5-3b-smoke/
            results/m5-3c-smoke/
            results/m5-4a-smoke/
            results/m5-4b0-smoke/
            results/m5-4b0r-smoke/
            results/m5-4c-smoke/
            results/m5-5a-smoke/
          retention-days: 30
