name: M5.8 progressive stochastic world generator

on:
  push:
    branches:
      - experiment/m5-8-progressive-stochastic-worlds
  pull_request:
    paths:
      - 'neuroevolution/m5_8_worlds.py'
      - 'tests/test_m5_8_worlds.py'
      - '.github/workflows/m5-8-worlds.yml'

permissions:
  contents: read

jobs:
  deterministic-worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: World connectivity and reproducibility tests
        run: python -m unittest discover -s tests -p 'test_m5_8_worlds.py' -v
      - name: Generate and audit 64 development worlds
        run: python -m neuroevolution.m5_8_worlds
      - name: Archive all worlds and exogenous events
        uses: actions/upload-artifact@v4
        with:
          name: m5-8-progressive-development-worlds
          path: results/m5-8/world-generator-development.json
          retention-days: 30
