name: FlyLoop R14 residual arbitration
on:
  push:
    branches: [experiment/flyloop-r14-residual-arbitration]
  pull_request:
    paths: ['neuroevolution/flyloop_r14.py','tests/test_flyloop_r14.py','.github/workflows/flyloop-r14.yml']
permissions:
  contents: read
jobs:
  arbitration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: R11–R14 regression
        run: |
          for i in 11 12 13 14; do
            python -m unittest discover -s tests -p "test_flyloop_r$i.py" -v
          done
      - name: Full frozen R14 campaign
        run: python -m neuroevolution.flyloop_r14
      - name: Deterministic repeat
        run: |
          python -m neuroevolution.flyloop_r14 --out results/flyloop_r14_repeat
          cmp results/flyloop_r14/summary.json results/flyloop_r14_repeat/summary.json
          cmp results/flyloop_r14/lives.jsonl.gz results/flyloop_r14_repeat/lives.jsonl.gz
          sha256sum results/flyloop_r14/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flyloop-r14-results
          path: results/flyloop_r14/
          retention-days: 30
          compression-level: 0
