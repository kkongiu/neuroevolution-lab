name: FlyLoop R13 body learning
on:
  push:
    branches: [experiment/flyloop-r13-body-learning]
    paths:
      - 'neuroevolution/flyloop_r13.py'
      - 'tests/test_flyloop_r13.py'
      - '.github/workflows/flyloop-r13.yml'
  pull_request:
    branches: [experiment/flyloop-r12c-body-senses]
    paths:
      - 'neuroevolution/flyloop_r13.py'
      - 'tests/test_flyloop_r13.py'
      - '.github/workflows/flyloop-r13.yml'
permissions:
  contents: read
jobs:
  body-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m neuroevolution.flyloop_r13 --out results/r13.json | tee results-summary.txt
      - run: python -m neuroevolution.flyloop_r13 --out results/r13-repeat.json
      - run: cmp results/r13.json results/r13-repeat.json
      - run: cat results-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flyloop-r13-body-learning
          path: |
            results/r13*.json
            results-summary.txt
