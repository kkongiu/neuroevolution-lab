name: M5.30 Support-Selected Operators

on:
  push:
    branches:
      - experiment/m5-30-experience-selected-operators
  pull_request:
    paths:
      - 'neuroevolution/m5_30_operator_selection.py'
      - 'tests/test_m5_30_operator_selection.py'
      - '.github/workflows/m5-30-operator-selection.yml'

permissions:
  contents: read

jobs:
  operator-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical backend
        run: python -m pip install 'numpy==2.3.5'
      - name: M5.30 own-feedback and no-exam-leak scientific tests
        run: python -m unittest discover -s tests -p 'test_m5_30_operator_selection.py' -v
      - name: Original M5.6 online plasticity regressions
        run: python -m unittest discover -s tests -p 'test_m5_6_online.py' -v
      - name: 'Experience-selected operators: full preregistered development campaign'
        run: python -m neuroevolution.m5_30_operator_selection
      - name: Preserve individual lives, selections, scores, seeds and all negative outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-30-operator-selection-development
          path: results/m5-30/operator-selection-development.json
          if-no-files-found: warn
          retention-days: 30
