name: FlyLoop R20C thermal protection
on:
  push:
    branches: [experiment/flyloop-r20c-thermal-protection]
    paths:
      - 'neuroevolution/flyloop_r20c.py'
      - 'tests/test_flyloop_r20c.py'
      - '.github/workflows/flyloop-r20c.yml'
  pull_request:
    branches: [experiment/flyloop-r20b-homeostatic-choice]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  thermal:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        seed: [28100, 28101, 28102, 28103, 28104, 28105, 28106, 28107, 28108, 28109, 28110, 28111, 28112, 28113, 28114, 28115, 28116, 28117, 28118, 28119, 28120, 28121, 28122, 28123]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m neuroevolution.flyloop_r20c --seed ${{ matrix.seed }} --out results/first
      - run: python -m neuroevolution.flyloop_r20c --seed ${{ matrix.seed }} --out results/repeat
      - run: diff -rq results/first results/repeat
      - uses: actions/upload-artifact@v4
        with:
          name: r20c-seed-${{ matrix.seed }}
          path: results/first/
          retention-days: 3
  aggregate:
    needs: thermal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: r20c-seed-*
          path: results/shards
      - run: |
          set -o pipefail
          python -m neuroevolution.flyloop_r20c --combine results/shards | tee results-summary.txt
          cat results-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: r20c-summary
          path: results-summary.txt
