name: M5.9c individual learning prerequisite gate

on:
  push:
    branches:
      - experiment/m5-9-individual-learning-gate
  pull_request:
    paths:
      - 'neuroevolution/m5_9_individual_gate.py'
      - 'tests/test_m5_9_individual_gate.py'
      - '.github/workflows/m5-9-individual-gate.yml'

permissions:
  contents: read

jobs:
  individual-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test cue blindness, controls, reversal and seed fences
        run: python -m unittest discover -s tests -p 'test_m5_9_individual_gate.py' -v
      - name: M5.9b delayed rewards regression
        run: python -m unittest discover -s tests -p 'test_m5_9_delayed.py' -v
      - name: Check 24 paired individual-learning and reversal probes
        run: python -m neuroevolution.m5_9_individual_gate
      - name: Archive complete observations
        uses: actions/upload-artifact@v4
        with:
          name: m5-9c-individual-learning-prerequisite
          path: results/m5-9/individual-learning-gate-development.json
          retention-days: 30
