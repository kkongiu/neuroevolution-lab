name: M5.6 ecological difficulty calibration

on:
  push:
    branches:
      - experiment/m5-6-memory-predator-curiosity-protocol
    paths:
      - 'neuroevolution/m5_6_difficulty.py'
      - 'tests/test_m5_6_difficulty.py'
      - '.github/workflows/m5-6-difficulty.yml'
  pull_request:
    paths:
      - 'neuroevolution/m5_6_difficulty.py'
      - 'tests/test_m5_6_difficulty.py'
      - '.github/workflows/m5-6-difficulty.yml'

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Development-only calibration invariants
        run: python -m unittest discover -s tests -p 'test_m5_6_difficulty.py' -v
      - name: Calibrate survival baseline on development worlds only
        run: python -m neuroevolution.m5_6_difficulty
      - name: Preserve full calibration rows and selection criteria
        uses: actions/upload-artifact@v4
        with:
          name: m5-6-development-difficulty-calibration
          path: results/m5-6/development-difficulty-calibration.json
          retention-days: 30
